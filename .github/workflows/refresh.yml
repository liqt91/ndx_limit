name: Daily Data Refresh

# 每日抓取数据并回写仓库。**只负责数据，不发任何邮件**（发信见 broadcast.yml）。
#
# 为什么和发信拆开：
#   1. scrape.mjs 只用 Node 内置模块，不需要 npm ci —— 这一步从 50 秒降到 15 秒级，
#      也少掉「装依赖失败」这一整类故障；
#   2. 发信失败不该把「数据更新成功」标记成失败（以前混在一起，红了分不清是谁坏了）；
#   3. 想重试发信时，不必重跑抓取、也不必再 push 一次数据。
#
# 回写那次 push 会触发 EdgeOne Pages 自动重建。
# GitHub 对公开仓库有「60 天无活动则停用定时任务」的规则，每日 commit 同时也保住了它。

# 定时由外部 cron 触发（腾讯轻量云 lhins-0ky4jsqs 的 crontab，见运维文档），
# 不再依赖 GitHub 自带 schedule——实测延迟可达 2h44m（2026-10-20）。

on:
  workflow_dispatch:

permissions:
  contents: write # 仅用于回写 data/；默认 token 只读，不开会 403

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # secrets 不能直接进 if，也不能靠「步骤级 env 在其自身 if 里判断」（会静默跳过）。
    # 官方推荐：job 级算成布尔标记，步骤 if 判断它。
    env:
      # 有 NOTIFY_WEBHOOK（飞书/Server酱，留作兼容）或 ALERT_EMAIL（Brevo 邮件，默认）就跑通知
      HAS_NOTIFY: ${{ secrets.NOTIFY_WEBHOOK != '' || secrets.ALERT_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史才能在其上 commit + push

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 日历自检，零网络、两秒钟，两条：
      #   美股产物 us-nasdaq.json 必须与「规则自算 + 官方金标准逐日比对」完全一致。
      #     手改会让日历静默错一天，而页面会一本正经地把它显示成「可申购」。
      #   A 股休市日与数据/calendars/cn-holiday-names.json 必须逐日对得上。
      #     不同步时悬停提示会给出错误原因（「国庆假期」其实开市），比不说更糟。
      - name: Verify calendars
        run: npm run calendar:check

      # 健康门禁：人民币覆盖率 < 阈值（默认 90%）→ 退出码 2，job 中止。
      # 于是不回写、EdgeOne 保留上次好构建，绝不会出现「今日全暂停」的假象。
      # 覆盖率按指数各算各的：纳指不达标整轮不写；标普500 不达标只丢它自己的点。
      - name: Scrape today's data
        run: node scripts/scrape.mjs

      # 附加信息：年费（管理+托管+销售服务）与年化跟踪误差，来源天天基金 F10 公开页。
      #
      # ★ 与额度抓取分开、且失败不阻断：这两列只是买之前的参考，抓不到时页面渲染
      #   「—」，不能让一次费率页改版把当天已经抓到的额度数据也卡在 CI 里不回写。
      #   用 `|| echo ::warning::` 而不是 continue-on-error —— 后者会让步骤在 UI 上
      #   变绿，静默漏抓；这样至少有一条黄色警告留在 run 里。
      # ★ 跟踪误差是**滞后指标**（每周更新一次，页面上标「截止至」），每天抓只是
      #   为了让那个截止日跟上，不是因为它每天会变。
      - name: Fetch fees (non-blocking)
        run: |
          node scripts/fetch-fees.mjs || echo "::warning::费率抓取失败，页面年费列将显示「—」（额度数据不受影响）"

      - name: Fetch tracking error (non-blocking)
        run: |
          node scripts/fetch-tracking.mjs || echo "::warning::跟踪误差抓取失败，页面误差列将显示「—」（额度数据不受影响）"

      # 口径隔离门禁：两个指数的份额共用一份 history.json，任何一处聚合漏了 indexKey
      # 都会让首屏把两边的额度加在一起（页面照样渲染，数字照样像真的）。
      # 只验数据层（--no-dist）：这一步不构建站点，渲染层在部署前由 EdgeOne 构建，
      # 本地/PR 上跑 `npm run check:index`（带 dist）能一起验。
      - name: Verify index isolation
        run: node scripts/check-index-isolation.mjs --no-dist

      # 发信口径门禁：订阅偏好裁剪（只订标普的人不许收到纳指的数字）、老记录默认只纳指、
      # 三份指数白名单一致、默认版次是 close（收盘前报）。全是字符串拼装，错了不会抛异常，
      # 只会在某个人信箱里安静地出现别人的数——所以必须进 CI，别靠人看。
      - name: Verify broadcast rules
        run: node scripts/check-broadcast.mjs

      # history.json 是 30 天柱状图的数据源，CI checkout 的是已提交版，不回写会逐天丢数据。
      # 无变化时跳过提交，避免每天产生空 commit。
      - name: Commit data back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/fund-meta.json data/fetch-meta.json data/announcements.json data/fund-fees.json data/fund-tracking.json
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            git commit -m "data: daily scrape $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # 管理员自通知（可选，单收件人）：默认走 Brevo 事务邮件发到站长邮箱
      # （Server酱/飞书未开通；与 /api/subscribe 复用 BREVO_API_KEY / MAIL_FROM）。
      # 放在这里而不是发信 job 里：数据抓完就能立刻知道变化，且不受发信失败影响。
      # 注意：这一步只覆盖「抓取成功后的变化摘要」；dispatch 这一跳的失败告警在
      # EdgeOne 边缘函数里（edge-functions/api/jobs/dispatch.js），两者互补。
      - name: Admin notify (optional)
        if: ${{ env.HAS_NOTIFY == 'true' }}
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_CHANNEL: ${{ secrets.NOTIFY_CHANNEL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node scripts/notify.mjs
