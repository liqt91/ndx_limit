name: Build and Deploy to Tencent COS (daily)

on:
  # 每天北京时间 08:00 自动重建并部署（UTC 00:00 = 北京 08:00，中国不实行夏令时）
  schedule:
    - cron: '0 0 * * *'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Scrape today's data (天天基金)
        run: node scripts/scrape.mjs

      - name: Build (static)
        run: npm run build

      - name: Commit updated data history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/fund-meta.json
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Deploy to COS
        env:
          BUCKET: ${{ secrets.COS_BUCKET }}
          REGION: ${{ secrets.COS_REGION }}
          SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: bash scripts/deploy-cos.sh "$BUCKET" "$REGION" "$SECRET_ID" "$SECRET_KEY"
